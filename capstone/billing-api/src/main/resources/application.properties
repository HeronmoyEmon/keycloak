# Capstone billing API -- adapted from chapter 34's lab (labs/spring-boot-resource-server), pointed
# at the capstone's own isolated Keycloak stack (capstone/docker-compose.yml, project capstonekc,
# host port 18200) instead of chapter 34's shared labs/docker stack on 8080.
server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:18200/realms/northwind-apps

logging.level.org.springframework.security=INFO

# New for the capstone: this app's own confidential client credentials, used server-side (never
# sent to a browser) so the app can act as its own UMA 2.0 resource server / Policy Enforcement
# Point against Keycloak's Protection API and token endpoint, per chapter 37's proven pattern --
# see UmaPermissionService for where these are actually used.
northwind.uma.token-endpoint=http://localhost:18200/realms/northwind-apps/protocol/openid-connect/token
northwind.uma.protection-endpoint=http://localhost:18200/realms/northwind-apps/authz/protection/permission
northwind.uma.client-id=billing-api
northwind.uma.client-secret=${BILLING_API_CLIENT_SECRET:}
northwind.uma.premium-report-resource-id=${PREMIUM_REPORT_RESOURCE_ID:}
