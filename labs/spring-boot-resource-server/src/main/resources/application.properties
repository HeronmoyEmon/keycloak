# Northwind Apps billing API -- reader-facing defaults.
#
# server.port is deliberately NOT 8080: this chapter's Keycloak instance (labs/docker/docker-
# compose.yml, started with the plain `docker compose up -d`) already publishes 8080 (Admin
# Console / Admin REST API / token endpoint) and 9000 (health/metrics). A reader runs both this
# app and that Keycloak side by side, so this app needs its own port.
server.port=8081

# Spring Security's OAuth2 Resource Server support fetches this realm's OpenID Connect discovery
# document (http://localhost:8080/realms/northwind-apps/.well-known/openid-configuration) at
# startup to learn the token issuer and JWKS endpoint, then caches and auto-refreshes the JWKS
# (chapter 16's JWK Set, ch08/ch16 recalled on this chapter's second slide) used to verify every
# incoming JWT's signature.
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/northwind-apps

# Keep Spring Security's own request logging reasonably visible while working through the lab;
# turn this down (or remove it) for anything beyond local lab use.
logging.level.org.springframework.security=INFO
